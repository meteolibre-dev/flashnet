name: Deploy Cloud Workflow & Scheduler

on:
  push:
    paths:
      - 'gcp/workflows/**'
      - '.github/workflows/deploy-workflow.yml'
  workflow_dispatch:

env:
  PROJECT_ID: meteoforecast
  REGION: europe-west1
  WORKFLOW_NAME: meteo-flashnet-sequence
  SCHEDULER_JOB_NAME: daily-meteo-sequence
  SERVICE_ACCOUNT: flashnet-backend@meteoforecast.iam.gserviceaccount.com

jobs:
  deploy-workflow:
    name: Deploy Workflow & Scheduler
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Deploy Cloud Workflow'
        run: |
          gcloud workflows deploy ${{ env.WORKFLOW_NAME }} \
            --source=gcp/workflows/sequential-jobs.yaml \
            --location=${{ env.REGION }} \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --project=${{ env.PROJECT_ID }}

      - name: 'Deploy Cloud Scheduler'
        run: |
          # Define scheduler variables
          SCHEDULE="0 8,15,20 * * *"
          URI="https://workflowexecutions.googleapis.com/v1/projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/workflows/${{ env.WORKFLOW_NAME }}/executions"

          echo "Deploying Cloud Scheduler job: ${{ env.SCHEDULER_JOB_NAME }}"

          # Try to create only if it doesn't exist, otherwise update
          if gcloud scheduler jobs describe ${{ env.SCHEDULER_JOB_NAME }} --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
            echo "Scheduler job exists. Updating..."
            gcloud scheduler jobs update http ${{ env.SCHEDULER_JOB_NAME }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --message-body="{}" \
              --oauth-service-account-email=${{ env.SERVICE_ACCOUNT }} \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }}
          else
            echo "Scheduler job does not exist. Creating..."
            gcloud scheduler jobs create http ${{ env.SCHEDULER_JOB_NAME }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --message-body="{}" \
              --oauth-service-account-email=${{ env.SERVICE_ACCOUNT }} \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }}
          fi
