[project]
name = "meteolibre-model"
version = "0.1.0"
description = "MeteoLibre Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "datasets",
    "torch",
    "accelerate",
    "tqdm",
    "torchvision>=0.23.0",
    "huggingface-hub[cli]>=0.0.1",
    "suncalc>=0.1.3",
    "scipy>=1.15.3",
    "tensorboard>=2.20.0",
    "einops>=0.8.1",
    "matplotlib",
    "pyproj>=3.7.1",
    "imageio>=2.37.0",
    "torchmetrics>=1.8.2",
    "scikit-learn>=1.7.2",
    "h5py>=3.15.1",
]

[tool.setuptools]
packages = ["meteolibre_model"]
