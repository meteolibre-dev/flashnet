main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: "meteoforecast"
          - location1: "europe-west3"
          - location2: "europe-west4"
          - job1_name: "meteo-backend-job"
          - job2_name: "flashnet-backend-gpu-job"

    - start_job1:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job1_name}
          location: ${location1}
        result: job1_execution  # This contains the specific execution ID

    - wait_for_job1:
        call: sys.sleep
        args:
          seconds: 30

    - check_job1_status:
        call: googleapis.run.v1.namespaces.executions.get
        args:
          # FIX: Construct the full resource path manually
          name: ${"namespaces/" + project_id + "/executions/" + job1_execution.metadata.name}
          location: ${location1}
        result: exec_status

    - check_if_done:
        switch:
          # Check for Succeeded condition
          - condition: ${default(map.get(exec_status.status, "completionTime"), null) != null}
            next: check_for_failure
          - condition: ${true}
            next: wait_for_job1

    - check_for_failure:
        switch:
          # If it completed but has a 'failed' count > 0, raise error
          - condition: ${default(map.get(exec_status.status, "failedCount"), 0) > 0}
            raise: ${"Job 1 failed with status " + exec_status.status.conditions[0].message}
        next: start_job2

    - start_job2:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job2_name}
          location: ${location2}
        result: final_result
    - return_result:
        return: ${final_result}