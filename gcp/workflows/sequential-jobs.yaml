main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: "meteoforecast"
          - location1: "europe-west3"
          - location2: "europe-west1"
          - job1_name: "meteo-backend-job"
          - job2_name: "flashnet-backend-gpu-job"

    # --- Step 1: Start Meteo Job ---
    - start_job1:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job1_name}
          location: ${location1}
        result: job1_execution

    # --- Step 2: Wait for Job 1 to complete ---
    - wait_for_job1:
        call: sys.sleep
        args:
          seconds: 30

    - check_job1_status:
        call: googleapis.run.v1.namespaces.jobs.get
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job1_name}
          location: ${location1}
        result: job1_status

    - check_if_done:
        switch:
          # Check if latest execution has completed
          - condition: ${default(map.get(job1_status.status, "completionTime"), null) != null}
            next: verify_success
          # Check if latest execution failed
          - condition: ${default(map.get(job1_status.status, "failed"), 0) > 0}
            raise: 'Job 1 failed'
          # Still running - continue waiting
          - condition: ${true}
            next: wait_for_job1

    - verify_success:
        next: start_job2

    # --- Step 3: Start Flashnet GPU Job ---
    - start_job2:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job2_name}
          location: ${location2}
        result: final_result
    - return_result:
        return: ${final_result}
