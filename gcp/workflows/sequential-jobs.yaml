main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: "meteoforecast"
          - location2: "europe-west4"
          - job2_name: "flashnet-backend-gpu-job"
          - lightning_server_url: "https://lightning-server-935480850831.europe-west3.run.app" # Added

    - start_job2:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job2_name}
          location: ${location2}
        result: final_result

    - wait_for_job2:
        call: sys.sleep
        args:
          seconds: 10

    - check_job2_status:
        call: googleapis.run.v1.namespaces.executions.get
        args:
          name: ${"namespaces/" + project_id + "/executions/" + final_result.metadata.name}
          location: ${location2}
        result: exec2_status

    - check_if_done2:
        switch:
          - condition: ${default(map.get(exec2_status.status, "completionTime"), null) != null}
            next: check_for_failure2
          - condition: ${true}
            next: wait_for_job2

    - check_for_failure2:
        switch:
          - condition: ${default(map.get(exec2_status.status, "failedCount"), 0) > 0}
            raise: ${"Job 2 failed with status " + exec2_status.status.conditions[0].message}
        next: clear_cache

    - clear_cache:
        call: http.get
        args:
          url: ${lightning_server_url + "/admin/clear-cache"}
        result: cache_response

    - return_result:
        return: ${cache_response}