main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: "meteoforecast"
          - location1: "europe-west3"
          - location2: "europe-west1"
          - job1_name: "meteo-backend-job"
          - job2_name: "flashnet-backend-gpu-job"

    # --- Step 1: Start Meteo Job ---
    - start_job1:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job1_name}
          location: ${location1}
        result: job1_execution

    # --- Step 2: Wait for Job 1 execution to complete ---
    - get_execution_name:
        assign:
          - execution_name: ${job1_execution.metadata.name}

    - wait_for_job1:
        call: sys.sleep
        args:
          seconds: 30

    - check_job1_execution:
        call: googleapis.run.v1.namespaces.jobs.executions.get
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job1_name + "/executions/" + execution_name}
          location: ${location1}
        result: execution_status

    - check_if_done:
        switch:
          # Check completion status - look for Completed condition
          - condition: ${default(map.get(execution_status.status, "completionTime"), null) != null}
            next: verify_success
          # Still running - continue waiting
          - condition: ${true}
            next: wait_for_job1

    - verify_success:
        switch:
          # Check if job succeeded (failedCount should be 0)
          - condition: ${default(map.get(execution_status.status, "failedCount"), 0) > 0}
            raise: 'Job 1 failed'
        next: start_job2

    # --- Step 3: Start Flashnet GPU Job ---
    - start_job2:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/" + job2_name}
          location: ${location2}
        result: final_result
    - return_result:
        return: ${final_result}
